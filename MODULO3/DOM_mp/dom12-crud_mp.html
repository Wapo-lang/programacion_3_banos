<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area de un Triángulo</title>
    <script src="dom12-crud.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 1280px;
            line-height: 1.5;
        }
        h2 {
            color: #333;
            margin-bottom: 18px;
        }
        #stats {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin: 18px 0 22px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 28px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .formulario {
            background-color: #f4f4f4;
            border: 1px solid #b0fce8;
            padding: 20px;
            margin-top: 20px;
        }
        .formulario input {
            margin: 5px 0;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        .formulario input{
            width: auto;
            padding: 10px 20px;
            margin-bottom: 10px;
        }
        .btn-agregar:hover {
            background-color: #4CAF50;
            color: white;
        }
        .btn-cancelar:hover {
            background-color: #f44336;
            color: white;
        }
        .stat-card {
            background-color: #f4f4f4;
            border: 1px solid #b0fce8;
            padding: 20px;
            flex: 1 1 220px;
            box-sizing: border-box;
        }
        .stats-card h3 {
            margin-top: 0;
            color: #333;
        }
        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
        }
        input {
            display: block;
            width: min(420px, 100%);
            padding: 8px;
            margin-bottom: 14px;
            box-sizing: border-box;
        }
        button {
            margin-right: 8px;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <h1>Eventos de DOM</h1>
    <h2>Crud de Productos</h2>
    <div id="stats">
        <div class="stat-card">
            <h3>Total Productos</h3>
            <p id="totalProductos">0</p>
        </div>
        <div class="stat-card">
            <h3>Precio Promedio</h3>
            <p id="precioPromedio">0</p>
        </div>
         <div class="stat-card">
            <h3>Producto Más Caro</h3>
            <p id="productoMasCaro">N/A</p>
        </div>
         <div class="stat-card">
            <h3>Producto Más Barato</h3>
            <p id="productoMasBarato">N/A</p>
        </div>
    </div>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" placeholder="Nombre del producto">
    <label for="descripcion">Descripción:</label>
    <input type="text" id="descripcion" placeholder="Descripción del producto">
    <label for="precio">Precio:</label>
    <input type="number" id="precio" placeholder="Precio del producto">
    <button id="btnAgregar" class="btn-agregar">Agregar Producto</button>
    <button id="btnCancelar" class="btn-cancelar" >Cancelar</button>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
        </tbody>
    </table>

    
</body>
</html>
