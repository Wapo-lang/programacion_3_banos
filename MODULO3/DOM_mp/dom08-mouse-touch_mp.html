<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cementerio del DOM - Reliquia Espectral</title>
    <script src="dom08-mouse-touch_mp.js" defer></script>
    <style>
        .boton {
            background-color: #7f1d1d;
            border: none;
            border-radius: 5px;
            color: white;
            padding: 0.5em 1em;
            cursor: pointer;
        }
    </style>
</head>

<body style="background-color: #0b0f19; color: #d1d5db; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px;">

    <h1 id="titulo" style="color: #a78bfa; text-shadow: 0 0 10px rgba(139, 92, 246, 0.5);"> Espectros y Reliquias en el DOM 🪦</h1>
    <h2 style="color: #34d399;"> Evento Mouse y Touch en la Cripta 🕯️</h2>
    <!-- Cuarto ejemplo -->
    <h2 style="color: #34d399;"> Evento Reliquia Triangular (Mouse Enter y Mouse Leave) 👻</h2>
    <div id="contenedorTriangulo" style="position:relative; 
        width:100%; 
        height:300px; 
        margin-top:20px; 
        background:#131c2e;
        border: 1px solid #374151;">
    <div id="triangulo" style="
        width: 0;
        height: 0;
        border-left: 50px solid transparent;
        border-right: 50px solid transparent;
        border-bottom: 100px solid #8b5cf6;
        position: absolute;
        top: 100px;
        left: calc(50% - 50px);
        transition: transform 0.2s ease;
        filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.6));">
    </div>
    </div>

</body>

</html>
