<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cementerio del DOM - Eventos</title>
    <script src="dom04-eventos_mp.js" defer></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #d1d5db;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #a78bfa;
            text-align: center;
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
        }
        h2 {
            color: #34d399;
            cursor: pointer;
            transition: color 0.2s;
        }
        h2:hover {
            color: #6ee7b7;
            text-decoration: underline;
        }
        .boton {
            background-color: #4c1d95;
            color: #f3f4f6;
            padding: 10px 20px;
            border: 1px solid #7c3aed;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px 0;
            transition: background 0.2s;
        }
        .boton:hover {
            background-color: #5b21b6;
        }
        input[type="text"] {
            background-color: #131c2e;
            border: 1px solid #374151;
            color: white;
            padding: 8px;
            border-radius: 6px;
            width: 100%;
            margin: 10px 0;
            box-sizing: border-box;
        }
        p {
            background-color: #131c2e;
            padding: 10px;
            border-left: 4px solid #8b5cf6;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1 id="titulo">Encantamientos y Eventos del DOM</h1>
    <h2 onclick="alert('👻 ¡Un espíritu se ha manifestado en el DOM!')">Eventos In Line (Haz clic aquí)</h2>
    
    <button class="boton" id="btn" onclick="mostrarAlerta()">Invocar Alma</button>
    <button class="boton" id="btn2" onclick="mostrarAlerta2()">Invocar Sombra</button>
    
    <ul id="lista.productos1"></ul>
    
    <button class="boton" id="btn3">Ritual con AddEventListener</button>
    <ul id="lista-productos2"></ul>

    <input id="campo" type="text" placeholder="Escribe un conjuro...">

    <input id="campo_actualizar_parrafo" type="text" placeholder="Escribe para invocar texto...">
    <p id="parrafo">Epitafio inicial en silencio</p>
</body>
</html>
