<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cementerio del DOM - Modificación</title>
    <script src="dom03-modificar_mp.js" defer></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #d1d5db;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px;
            text-align: center;
        }
        h1 {
            color: #a78bfa;
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
        }
        h2 {
            color: #34d399;
        }
        .boton {
            background-color: #4c1d95;
            color: white;
            padding: 10px 20px;
            border: 1px solid #7c3aed;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .boton:hover {
            background-color: #5b21b6;
        }
        a {
            color: #38bdf8;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1 id="titulo">Modificar lápidas y elementos del DOM</h1>
    <h2>Epitafio original en la cripta</h2>
    <a id="link" href="#">Portal al más allá</a>

</html>
