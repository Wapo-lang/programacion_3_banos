<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gremio de Sepultureros — Prioridad de Conjuros CSS</title>
    <style>
        /* Estilos Internos (Embedded/Internal CSS) 
           Inscritos directamente en la piedra angular (head) */
        h2 {
            color: aqua; /* Fuego fatuo base */
            font-size: 3rem;
            text-shadow: 2px 2px 5px rgba(0, 255, 255, 0.3);
        }
    </style>
    <!-- Estilos Externos (External CSS) 
         Invocados desde los archivos prohibidos de la cripta -->
    <link rel="stylesheet" href="css/01_formas_mp.css">
</head>
<body>

    <!-- Estilo en Línea (Inline CSS): Forzado con tinta de nigromante -->
    <h1 style="color: rgb(26, 192, 70);">Bienvenidos a la Cripta - Código Inline</h1>
    
    <h2>Mausoleo del Norte (Aplica estilo interno del head)</h2>
    
    <p style="color: #4a4a4a; font-size: 1.2rem; font-style: italic;">
        "Aquí yacen los selectores que olvidaron cerrar sus etiquetas en vida."
    </p>
    
    <h2>Fosa Común</h2>
    
    <!-- Demostración de la especificidad: El estilo inline es el conjuro más fuerte. 
         Destruye el color aqua del head y tiñe la lápida de rojo sangre. -->
    <h2 style="color: red;">Prevalencia del Epitafio (Inline Prevalence — Gana el Rojo)</h2>

</body>
</html>
