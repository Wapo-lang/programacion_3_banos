<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3er Semestre — Propiedad Display</title>
    <link rel="stylesheet" href="04_display.css">
</head>
<body>

    <h1>CSS Display Property</h1>
    
    <div class="banner-oferta">🔥 Oferta especial: 20% en laptops</div>

    <div class="etiqueta-nuevo">Nuevo Producto</div>
    <a href="#" class="btn-carrito">Ir al Carrito</a>

    <button onclick="toggleMenu()" class="btn-menu">Alternar Menú</button>
    
    <div id="menu" class="menu-movil">
        <ul>
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Servicios</a></li>
            <li><a href="#">Contacto</a></li>
        </ul> </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('menu');
            menu.classList.toggle('activo');
        }
    </script>
</body>
</html>
