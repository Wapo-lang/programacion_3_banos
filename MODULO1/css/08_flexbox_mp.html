<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3er Semestre — Distribución Flexbox</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="08_flexbox_mp.css">
</head>

<body>
    <h1 style="color: #e63946">Alineación Tridimensional: Flexbox</h1>
    
    <!-- Fila de ataúdes (Distribución básica horizontal) -->
    <div class="mausoleos-fila">
        <div class="urna-item">Urna de Plata</div>
        <div class="urna-item">Urna de Bronce</div>
        <div class="urna-item">Urna de Obsidiana</div>
    </div>

    <!-- Contenedor con dirección de columna (Vertical) -->
    <div class="criptas-columna">
        <div class="urna-item">Lápida Norte</div>
        <div class="urna-item">Lápida Sur</div>
        <div class="urna-item">Lápida Este</div>
    </div>

    <!-- Barra de navegación de la Necrópolis (Espaciada simétricamente) -->
    <div class="navbar-sacra">
        <div class="nav-sendero">Catacumbas</div>
        <div class="nav-sendero">Osarios</div>
        <div class="nav-sendero">Gárgolas</div>
    </div>

    <br>
    <h2>Demostración de Justificación de Espacio (`justify-content`)</h2>
    
    <!-- Contenedor para analizar la separación de los elementos -->
    <div class="contenedor-distribuido">
        <div class="nav-sendero">Punto A</div>
        <div class="nav-sendero">Punto B</div>
        <div class="nav-sendero">Punto C</div>
    </div>

</body>

</html>
