<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Separadores</title>
</head>
<body>
    <h1> Separadores en Formularios</h1>
    <form action="/procesar" method="post"> 
        <table border="1">
            <tr>
                <td colspan="2">
                    <fieldset>
                        <legend> Informacion Personal </legend>
                        <label for="nombre"> Nombre </label>
                        <input type="text" id="nombre" name="nombre"><br>

                        <label for="email"> Correo Electronico </label>
                        <input type="email" id="email" name="email"><br>

                        <label for="telefono"> Telefono </label>
                        <input type="tel" id="telefono" name="telefono"><br>
                    </fieldset>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <fieldset>
                        <legend> Informacion de Pago </legend>
                        <label for="tarjeta"> Numero de Tarjeta </label>
                        <input type="text" id="tarjeta" name="tarjeta"><br>

                        <label for="vencimiento"> Fecha de Vencimiento </label>
                        <input type="month" id="vencimiento" name="vencimiento"><br>

                        <label for="cvv"> CVV </label>
                        <input type="password" id="cvv" name="cvv"><br>
                    </fieldset>
                </td>
            </tr>

            <!-- Separador Horizontal -->
            <tr> 
                <td colspan="2">
                    <hr> <!-- Separador Horizontal -->
                </td>
            </tr>

            <!-- Otro Campo despues del Separador -->
            <tr> 
                <td colspan="2">
                    <label for="comentarios"> Comentarios Adicionales </label><br>
                    <textarea id="comentarios" name="comentarios" rows="4" cols="50"></textarea><br>
                </td>
            </tr>

        </table>

        <button type="submit"> Enviar </button>
    
</body>
</html>
